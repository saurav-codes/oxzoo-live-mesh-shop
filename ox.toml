# mesh-shop: one project, five processes.
#   browser -> Caddy -> web (static) and /api, /_zoo -> gateway (Go, [app])
#   gateway -> orders (Bun, port worker) and stock (Python, port worker)
#   fulfiller (Node) pops the redis list and sends the signed webhook.
# ox provides ORDERS_URL and STOCK_URL for the two port = true workers.
[app]
start  = "exec ./gateway/bin/gateway"
health = "/_zoo/health"

[static]
dir = "web/dist"
spa = true
api = ["/api", "/_zoo"]

# No root lockfile: each process installs from its own folder.
[build]
commands = [
  "cd gateway && go build -ldflags \"-X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)\" -o bin/gateway .",
  "cd stock && uv sync --frozen --no-dev",
  "cd fulfiller && npm ci --omit=dev",
  "cd web && bun run build.ts",
]
migrate = "cd stock && .venv/bin/python migrate.py"

[workers]
orders    = { run = "cd orders && exec bun run server.ts", port = true, health = "/health" }
stock     = { run = "cd stock && exec .venv/bin/uvicorn main:app --host 127.0.0.1 --port $PORT", port = true, health = "/health" }
fulfiller = "cd fulfiller && exec node fulfiller.js"

[services]
postgres = {}
redis    = {}

[tools]
go     = "1.27"
bun    = "1.3"
node   = "24"
uv     = "0.11"
python = "3.13"
